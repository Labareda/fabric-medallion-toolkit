[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-medallion-toolkit"
version = "0.3.59"
description = "Reusable, source-agnostic Bronze/Silver/Gold ingestion toolkit for Microsoft Fabric"
requires-python = ">=3.10"
authors = [{ name = "Ana" }]
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
spark = ["pyspark>=3.4", "delta-spark>=2.4"]

[tool.setuptools.packages.find]
where = ["src"]
